name: Contribution snake

# Renders the contribution graph as an animated snake in the profile palette
# and commits it straight into .github/assets/ on main — so the repo stays on a
# single branch and the README can use a plain relative path.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # svg-only is the lighter variant of the action — we never generate a gif,
      # and the shorter job is less exposed to runner-acquisition timeouts.
      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_dots runs empty → most active, and the docs require exactly 5.
          # Mint ramp on light, the same ramp over the profile navy on dark.
          outputs: |
            dist/snake.svg?color_snake=#31b89b&color_dots=#eef4fb,#b7e9dc,#7fd8c2,#3fc0a4,#1f8f79
            dist/snake-dark.svg?color_snake=#63e0c7&color_dots=#0d1524,#173b3a,#22645a,#3ba98f,#63e0c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only assert what is certain: the files exist and are not empty. Sizes and
      # animation technique are logged, not enforced — guessing thresholds here
      # once failed perfectly good runs.
      - name: Inspect the generated files
        run: |
          echo "── dist ──"
          ls -la dist/ || true
          for f in dist/snake.svg dist/snake-dark.svg; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty — the action produced nothing"; exit 1
            fi
            echo "$f -> $(stat -c%s "$f") bytes"
            if grep -q "@keyframes" "$f"; then
              echo "  animation: CSS keyframes"
            elif grep -q "<animate" "$f"; then
              echo "  animation: SMIL"
            else
              echo "::warning::$f has no animation markers — check it renders as expected"
            fi
          done

      - name: Commit into assets branch
        run: |
          set -euo pipefail
          git fetch origin assets || true
          git checkout assets || git checkout --orphan assets
          mkdir -p .github/assets
          cp dist/snake.svg dist/snake-dark.svg .github/assets/
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/snake.svg .github/assets/snake-dark.svg

          if git diff --staged --quiet; then
            echo "::notice::Snake unchanged since the last run - nothing to commit."
            exit 0
          fi
          git commit -m "Update contribution snake [skip ci]"

          # main can move while this job runs - rebase and retry rather than
          # failing the whole workflow on a non-fast-forward push.
          for attempt in 1 2 3; do
            if git push --set-upstream origin assets; then
              echo "::notice::Committed a fresh snake to assets branch."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}) - rebasing onto the latest assets branch."
            git pull --rebase --autostash origin assets
          done
          echo "::error::Could not push after 3 attempts."
          exit 1