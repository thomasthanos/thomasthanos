name: Contribution snake

# Renders the contribution graph as an animated snake, in the same palette as
# the rest of the profile, and publishes it to the `output` branch.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # colour_dots goes empty → most active. Mint ramp on light, the same
          # ramp on the profile's navy for dark, so it matches the banner.
          outputs: |
            dist/github-snake.svg?color_snake=#31b89b&color_dots=#eef4fb,#b7e9dc,#7fd8c2,#3fc0a4,#1f8f79
            dist/github-snake-dark.svg?color_snake=#63e0c7&color_dots=#0d1524,#173b3a,#22645a,#3ba98f,#63e0c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation [skip ci]"
