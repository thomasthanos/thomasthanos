name: Profile stats

# Renders .github/assets/stats.svg and top-langs.svg from live GitHub data and
# commits them. Self-hosting these means the profile can never show a broken
# image because a shared stats service is rate-limited.

on:
  schedule:
    - cron: "17 3 * * *"      # daily, off the hour to dodge the peak
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet fonttools

      - name: Render stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/gen_stats.py "${{ github.repository_owner }}"

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/stats.svg .github/assets/top-langs.svg
          if git diff --staged --quiet; then
            echo "Stats unchanged — nothing to commit."
          else
            git commit -m "Update profile stats [skip ci]"
            git push
          fi
